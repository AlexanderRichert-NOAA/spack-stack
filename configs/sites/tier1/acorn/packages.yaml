packages:
  #
  ### Providers
  #
  blas:
    require: ['openblas']
  fftw-api:
    require: ['fftw']
  jpeg:
    require: ['libjpeg-turbo']
  lapack:
    require: ['openblas']
  mkl:
    buildable: false
  mpi:
    buildable: false
    require: ['cray-mpich']
  #
  ### Individual package settings
  #
  curl:
    require: ['~nghttp2']
  flex:
    require: ['@2.6.4']
  gdal:
    require: ['~curl']
  icu4c:
    require: ['%gcc']
  ip:
    require: ['+alltests']
  libxslt:
    require: ['~crypto']
  mapl:
    require: ['~pflogger', '~fargparse', '~extdata2g']
  py-pandas:
    require:: ['~excel']
  subversion:
    require: ['~serf', '+pic']
  zlib-ng:
    require: ['+compat', '~new_strategies']
