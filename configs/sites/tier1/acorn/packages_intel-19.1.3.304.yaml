  packages:
  ### Compilers / compiler runtimes
  intel-oneapi-compilers-classic:
    buildable: false
    externals:
    - spec: intel-oneapi-compilers-classic@19.1.3.304
      modules:
      - PrgEnv-intel/8.5.0
      - craype/2.7.17
      - intel/19.1.3.304
      - libfabric
      extra_attributes:
        compilers:
          c: cc
          cxx: CC
          fortran: ftn
        environment:
          set:
            CONFIG_SITE: ''
  gcc:
    buildable: false
    externals:
    - spec: gcc@10.3.0 languages:='c,c++,fortran'
      prefix: /opt/cray/pe/gcc/10.3.0/snos/
      extra_attributes:
        compilers:
          c: /opt/cray/pe/gcc/10.3.0/snos/bin/gcc
          cxx: /opt/cray/pe/gcc/10.3.0/snos/bin/g++
          fortran: /opt/cray/pe/gcc/10.3.0/snos/bin/gfortran
        environment:
          set:
            # OpenSUSE on WCOSS2 machines sets CONFIG_SITE so
            # Automake-based builds are installed in lib64
            # which confuses some packages.
            CONFIG_SITE: ''
  gcc-runtime:
    require: '%gcc@10.3.0'
  all:
    prefer: ['%intel@19.1.3.304']
    compiler:: [intel@19.1.3.304, gcc@10.3.0]
      providers:
        mpi:: [cray-mpich@8.1.9]
        # Remove the next three lines to switch to intel-oneapi-mkl
        blas:: [openblas]
        fftw-api:: [fftw]
        lapack:: [openblas]
    mpi:
      buildable: False
    cray-mpich:
      externals:
      - spec: cray-mpich@8.1.9~wrappers
        modules:
        - libfabric
        - craype-network-ofi
        - cray-mpich/8.1.9
        - cray-pals
    intel-oneapi-mkl:
      # Remove buildable: False and configure+uncomment externals section below to use intel-oneapi-mkl
      buildable: False
      #externals:
      #- spec: intel-oneapi-mkl@2022.0.2%intel@2021.5.0
      #  prefix: /apps/oneapi
    # DH* Remove this section to switch to intel-oneapi-mkl
    ectrans:
      require::
      - '@1.2.0 ~mkl +fftw'
    gsibec:
      require::
      - '@1.2.1 ~mkl'
    py-numpy:
      require::
      - '^[virtuals=lapack,blas] openblas'
      - '@1.26 %gcc'
    # *DH
    eckit:
      require:
      - any_of: ["@1.23.1"]
        when: "%intel@19.1.3.304"
    eccodes:
      require:
      - any_of: ["@2.25.0"]
        when: "%intel@19.1.3.304"
        message: "2.25.0 is the last version to use C++11 (as opposed to C++17)"
    gettext:
      require: ['%gcc', '@0.21.1']
    py-scipy:
      require:
      - any_of: ["@1.10.1"]
        when: "%intel@19.1.3.304"
    cdo:
      require:
      - any_of: ["@2.3.0"]
        when: "%intel@2022.0.2.262"
        message: "2.3.0 is the last version to use C++17"
      - any_of: ["@2.0.5"]
        when: "%intel@19.1.3.304"
        message: "2.0.5 is the last version to use C++14"
