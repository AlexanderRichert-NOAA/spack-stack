# This template contains packages to be built with GCC that do *not* serve as link dependencies.
# They are either standalone applications (ecflow, awscli) and/or build dependencies (cmake, gmake) used by the nco-sci environments.
spack:
  concretizer:
    unify: true

  config:
    install_tree:
      root: $env/install
    deprecated: true

  view: false

  include: []

  specs:
  - awscli
  - cmake@3
  - ecflow
  - git
  - git-lfs
  - gmake
  - imagemagick
  - perl
  - rsync
  - subversion
  # GEMPAK dependencies:
  - motif
  - libxt
  - libsm
  - libxtst
  - libice
  - libxi
  - libxext
  - libx11
  - xproto
