packages:
  ### Providers
  blas:
    require: ['openblas']
  fftw-api:
    require: ['fftw']
  jpeg:
    require: libjpeg-turbo
  lapack:
    require: ['openblas']
  mkl:
    buildable: false
  mpi:
    buildable: false
    require: ['cray-mpich']
  ### Individual package settings
  # Use `require::` to override require's from common/packages.yaml,
  # and `require:<newline>  - '...'` to add to existing ones.
  boost:
    require::
      - >-
        @1.84 ~atomic +chrono +date_time +exception +filesystem ~graph ~iostreams
        ~locale ~log ~math ~mpi ~numpy +pic +program_options +python ~random
        +regex +serialization ~signals +system +test +thread +timer ~wave
        visibility=hidden cxxstd=17
  cdo:
    require: ['grib2=none']
  crtm:
    require: ['@2.4.0.1', '+fix']
  curl:
    require: ['~nghttp2']
  ecmwf-atlas:
    require:: ['+fckit', '~trans', '~fftw']
  ectrans:
    require:: ['+fftw']
  flex:
    require: ['@2.6.4']
  gdal:
    variants: ~curl
  git-lfs:
    require: ['%gcc']
  icu4c:
    require: ['%gcc']
  ip:
    require: ['+alltests']
  libxslt:
    require: ['~crypto']
  mapl:
    require: ['~pflogger', '~fargparse', '~extdata2g']
  netcdf-c:
    require:: ['+mpi', '~parallel-netcdf', '~dap', '~blosc', '~szip', 'build_system=autotools']
  py-pandas:
    require:: ['~excel']
  scotch:
    require::
      - '@7.0.7'
      - +mpi
      - +metis
      - ~shared
      - ~threads
      - ~mpi_thread
      - +noarch
      - +esmumps
      - build_system=cmake
  subversion:
    require: ['~serf'. '+pic']
  zlib-ng:
    require: ['+compat', '~new_strategies']

