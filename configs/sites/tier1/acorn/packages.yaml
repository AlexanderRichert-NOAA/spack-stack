packages:
  #
  ### Providers
  #
  blas:
    require:: ['openblas']
  fftw-api:
    require: ['fftw']
  jpeg:
    require: ['libjpeg-turbo']
  lapack:
    require:: ['openblas']
  mkl:
    buildable: false
  mpi:
    buildable: false
    require: ['cray-mpich']
  #
  ### Individual package settings
  #
  gdal:
    require: ['~curl']
  icu4c:
    require: ['%gcc']
  libxslt:
    require: ['~crypto']
  py-pandas:
    require:: ['~excel']
  subversion:
    require: ['~serf', '+pic']
  zlib-ng:
    require: ['+compat', '~new_strategies']
