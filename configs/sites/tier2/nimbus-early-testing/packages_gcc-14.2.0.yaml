packages:
  #
  ### Compilers
  #
  c:
    require: ['gcc@14.2.0']
  cxx:
    require: ['gcc@14.2.0']
  fortran:
    require: ['gcc@14.2.0']
  gcc:
    buildable: false
    externals:
    - spec: gcc@14.2.0 languages:='c,c++,fortran'
      prefix: /usr
      extra_attributes:
        compilers:
          c: /usr/bin/gcc-14
          cxx: /usr/bin/g++-14
          fortran: /usr/bin/gfortran-14
  gcc-runtime:
    require: '%gcc@14.2.0'
  #
  ### Provider settings & externals
  #
  mpi:
    require: ['openmpi']
